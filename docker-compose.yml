services:
  nginx:
    image: nginx:alpine
    container_name: gallery_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - phpmyadmin
    restart: always

  web:
    image: php:8.1-apache
    container_name: gallery_web
    volumes:
      - ./src:/var/www/html
    restart: always
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: gallery_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: gallery_db
      MYSQL_USER: gallery_user
      MYSQL_PASSWORD: gallery_password
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gallery_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword123
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: gallery_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: gallery_grafana
    ports:
      - "3000:3000"
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gallery_cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always