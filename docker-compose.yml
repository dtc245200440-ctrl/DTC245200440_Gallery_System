version: '3.8'

services:
  web:
    image: php:8.1-apache
    container_name: gallery_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    restart: always
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: gallery_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: gallery_db
      MYSQL_USER: gallery_user
      MYSQL_PASSWORD: gallery_password
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gallery_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword123
    restart: always